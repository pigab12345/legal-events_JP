name: 法学イベント巡回・AI構造化・自動更新

on:
  schedule:
    - cron: "0 21 1,15 * *"  # 毎月1日・15日 UTC21:00 = JST 06:00（約2週に1回）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存関係インストール
        run: pip install -r scripts/requirements.txt

      - name: 巡回・AI構造化・自動登録を実行
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/crawl_and_structure.py

      - name: events.jsonをコミット・push
        run: |
          git config user.name "legal-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json data/candidates.json data/geocache.json data/sources.json data/page_hashes.json
          git diff --cached --quiet && echo "変更なし" && exit 0
          git commit -m "🤖 イベント情報を自動更新"
          git push
